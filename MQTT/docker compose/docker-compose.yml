services:
  emqx:
    image: emqx/emqx:6.2.2 # پین کردن نسخه دقیق به جای latest
    container_name: emqx-server
    restart: always
    ports:
      - "1883:1883"       # MQTT TCP
      - "8883:8883"       # MQTT SSL (در صورت نیاز به TLS)
      - "8083:8083"       # MQTT WebSocket
      - "8084:8084"       # MQTT WSS
      - "127.0.0.1:18083:18083" # Dashboard فقط روی localhost (امنیتی)
    environment:
      - EMQX_NODE__NAME=emqx@127.0.0.1
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=YourStrongPassword123!
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - emqx_etc:/opt/emqx/etc # ماندگاری فایل‌های کانفیگ و ACL
    networks:
      - iot-net

volumes:
  emqx_data:
  emqx_log:
  emqx_etc:

networks:
  iot-net:
    driver: bridge # ساخت خودکار شبکه در صورت عدم وجود
